      value: No link
    - dps_val: 1
      value: Weak
    - dps_val: 2
      value: Medium
    - dps_val: 3
      value: Good
    - dps_val: 4
      value: Excellent
- entity: binary_sensor
  name: RF 2 battery low
  class: battery
  category: diagnostic
  dps:
  - id: 117
    type: base64
